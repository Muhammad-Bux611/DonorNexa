# ==============================================================================
# DonorNexa — Standalone Development & Viva Demonstration Profile (H2 In-Memory)
# ==============================================================================
# Allows running the entire application immediately on ANY machine without installing
# or configuring MySQL. Uses H2 in MySQL compatibility mode.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ==============================================================================

spring.application.name=DonorNexa-Dev
server.port=${SERVER_PORT:8080}

# In-memory H2 database with MySQL compatibility
spring.datasource.url=jdbc:h2:mem:donornexa_dev;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Timezone Asia/Karachi (CEP mandate)
spring.jackson.time-zone=Asia/Karachi

# Upload Storage
app.upload.dir=${UPLOAD_DIR:uploads}
donornexa.upload.dir=${app.upload.dir}
donornexa.upload.max-file-size=2097152

# Thymeleaf Template Cache (false for dev)
spring.thymeleaf.cache=false

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging Configuration
logging.level.com.donornexa=INFO
logging.level.org.springframework.security=INFO

# In dev/demo mode, do not force admin password change on first login
donornexa.admin.force-first-login-change=false
donornexa.admin.initial-password=ValidPass123!
