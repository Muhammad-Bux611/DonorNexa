# ==============================================================================
# DonorNexa — Example Environment Configuration Properties
# Copy this file to application-local.properties or set the corresponding
# environment variables on your operating system (Windows / Linux).
# ==============================================================================

spring.application.name=DonorNexa
server.port=8080

# Database Configuration (MySQL 8)
# Create database first: CREATE DATABASE donornexa_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=jdbc:mysql://localhost:3306/donornexa_db
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL Strategy:
# Use 'update' for development/automatic column sync without dropping tables/views.
# Use 'validate' when schema has been initialized via sql/schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Timezone & Internationalization
spring.jackson.time-zone=Asia/Karachi

# Upload Directory (Defaults to 'uploads' folder in project root)
app.upload.dir=uploads
donornexa.upload.dir=uploads
donornexa.upload.max-file-size=2097152

# Thymeleaf Template Caching
spring.thymeleaf.cache=false

# Session Security
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Security Policy
donornexa.admin.force-first-login-change=true
