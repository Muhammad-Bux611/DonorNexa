spring.application.name=DonorNexa

# Server Port (Supports Render's $PORT or custom SERVER_PORT)
server.port=${PORT:${SERVER_PORT:8080}}

# MySQL Database Configuration (Configurable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/donornexa_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:software@muet19}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Timezone Asia/Karachi (CEP mandate)
spring.jackson.time-zone=Asia/Karachi

# Upload Storage (Portable, relative path default)
app.upload.dir=${UPLOAD_DIR:uploads}
donornexa.upload.dir=${app.upload.dir}
donornexa.upload.max-file-size=2097152

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thymeleaf Template Cache (false for development, true for production)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging Configuration
logging.level.com.donornexa=INFO
logging.level.org.springframework.security=INFO

# Security Policy: initial administrator account configuration
donornexa.admin.initial-password=ValidPass123!
donornexa.admin.force-first-login-change=false
