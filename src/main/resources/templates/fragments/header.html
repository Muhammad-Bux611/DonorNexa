<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Top Header Bar Fragment -->
<header th:fragment="topbar(pageTitle, breadcrumbText)" class="dn-topbar">
    
    <div class="d-flex align-items-center gap-2 gap-sm-3">
        <!-- Mobile Toggle Button (Visible on screens < 992px) -->
        <button class="btn btn-outline-danger btn-sm d-lg-none dn-menu-toggle-btn"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebarOffcanvas"
                aria-controls="sidebarOffcanvas"
                aria-label="Toggle navigation drawer">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
            </svg>
        </button>

        <div class="overflow-hidden">
            <h5 class="fw-bold mb-0 text-dark text-truncate" th:text="${pageTitle}">Dashboard</h5>
            <small th:if="${breadcrumbText != null}" class="text-muted d-none d-sm-inline text-truncate" th:text="${breadcrumbText}">Overview</small>
        </div>
    </div>

    <!-- Right Top Header Actions -->
    <div class="d-flex align-items-center gap-3">
        
        <!-- Notification Dropdown -->
        <div class="dropdown">
            <button class="btn btn-link position-relative p-1 text-decoration-none d-flex align-items-center border-0"
                    type="button"
                    id="notificationDropdown"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    title="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="text-secondary" viewBox="0 0 16 16">
                    <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/>
                </svg>
                <span th:if="${unreadNotificationCount > 0}"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      style="font-size: 0.65rem;"
                      th:text="${unreadNotificationCount}">
                    1
                </span>
            </button>
            <div class="dropdown-menu dropdown-menu-end shadow border-0 p-0"
                 aria-labelledby="notificationDropdown"
                 style="width: 320px; max-width: 90vw;">
                <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light rounded-top">
                    <div class="fw-bold text-dark small">
                        Notifications
                        <span th:if="${unreadNotificationCount > 0}" class="badge bg-danger rounded-pill ms-1" th:text="${unreadNotificationCount}"></span>
                    </div>
                    <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post" class="m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-link btn-sm text-danger p-0 text-decoration-none" style="font-size: 0.75rem;">
                            Mark all read
                        </button>
                    </form>
                </div>
                <div class="list-group list-group-flush" style="max-height: 260px; overflow-y: auto;">
                    <div th:if="${#lists.isEmpty(recentNotifications)}" class="p-3 text-center text-muted small">
                        No notifications yet.
                    </div>
                    <a th:each="n : ${recentNotifications}"
                       th:href="@{/notifications}"
                       class="list-group-item list-group-item-action p-2 text-decoration-none"
                       th:classappend="${n.notificationStatus.name() == 'UNREAD'} ? 'bg-light border-start border-danger border-3' : ''">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-semibold text-dark text-truncate" style="font-size: 0.8rem; max-width: 190px;" th:text="${n.title}">Title</span>
                            <span class="text-muted" style="font-size: 0.65rem;"
                                  th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'dd MMM HH:mm') : ''}">Date</span>
                        </div>
                        <p class="text-muted mb-0 text-truncate" style="font-size: 0.75rem;" th:text="${n.message}">Message</p>
                    </a>
                </div>
                <div class="p-2 border-top text-center bg-white rounded-bottom">
                    <a th:href="@{/notifications}" class="text-danger small fw-semibold text-decoration-none">
                        View All Notifications &rarr;
                    </a>
                </div>
            </div>
        </div>

        <!-- User Identity Shortcut -->
        <div class="d-flex align-items-center gap-2 ps-2 border-start">
            <div class="dn-avatar-circle" style="width: 34px; height: 34px; font-size: 0.85rem;"
                 th:text="${currentUser != null and currentUser.fullName != null and !currentUser.fullName.isBlank() ? #strings.substring(currentUser.fullName, 0, 1).toUpperCase() : 'U'}">
                U
            </div>
            <div class="d-none d-sm-block text-start">
                <div class="small fw-bold text-dark lh-1"
                     th:text="${currentUser != null ? currentUser.fullName : (userEmail != null ? userEmail : 'User')}">
                    User Name
                </div>
                <span class="text-muted" style="font-size: 0.7rem;"
                      th:text="${currentUser != null ? currentUser.role : (userRole != null ? userRole : '')}">
                    ROLE
                </span>
            </div>
        </div>

    </div>

</header>

<!-- Mobile Offcanvas Drawer Wrapping the Sidebar Fragment -->
<div th:fragment="mobileSidebar(activeTab)"
     class="offcanvas offcanvas-start d-lg-none"
     tabindex="-1"
     id="sidebarOffcanvas"
     aria-labelledby="sidebarOffcanvasLabel"
     style="width: min(290px, 85vw);">
    <div class="offcanvas-header border-bottom py-3 px-3">
        <div class="d-flex align-items-center gap-2">
            <span class="fs-5 text-danger fw-bold">&#10084;</span>
            <h5 class="offcanvas-title fw-bold text-danger mb-0" id="sidebarOffcanvasLabel">DonorNexa</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0 d-flex flex-column">
        <!-- Reuses the exact same sidebar fragment -->
        <div th:replace="~{fragments/sidebar :: sidebar(${activeTab})}"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var offcanvasEl = document.getElementById('sidebarOffcanvas');
            if (offcanvasEl) {
                var links = offcanvasEl.querySelectorAll('.dn-menu-item, .dn-logout-btn');
                links.forEach(function(link) {
                    link.addEventListener('click', function() {
                        if (typeof bootstrap !== 'undefined' && bootstrap.Offcanvas) {
                            var bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
                            if (bsOffcanvas) {
                                bsOffcanvas.hide();
                            }
                        }
                    });
                });
            }
        });
    </script>
</div>

</body>
</html>
