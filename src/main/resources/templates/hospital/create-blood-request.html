<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Blood Request | DonorNexa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="dn-dashboard-wrapper">
    <!-- Desktop Persistent Sidebar -->
    <div class="d-none d-lg-block">
        <div th:replace="~{fragments/sidebar :: sidebar('blood-requests')}"></div>
    </div>
    <!-- Mobile Offcanvas Sidebar Drawer -->
    <div th:replace="~{fragments/header :: mobileSidebar('blood-requests')}"></div>

    <!-- Main Content -->
    <div class="dn-main-content">
        <div th:replace="~{fragments/header :: topbar('Raise Blood Request', 'Create a new clinical blood requirement')}"></div>

        <main class="container-fluid px-4 py-4 flex-grow-1">

            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <!-- Alert message -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                        <span th:text="${errorMessage}">Error creating request</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <div class="card-header bg-danger text-white py-3 px-4">
                            <h5 class="fw-bold mb-0">Emergency Patient Blood Request</h5>
                            <small class="text-white-50">Specify the required ABO/Rh group, volume, and urgency level.</small>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/hospital/blood-requests/new}" th:object="${requestForm}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div class="row g-3">
                                    <!-- Blood Group -->
                                    <div class="col-md-6">
                                        <label for="bloodGroup" class="form-label fw-semibold">Required Blood Group <span class="text-danger">*</span></label>
                                        <select id="bloodGroup" th:field="*{bloodGroup}" class="form-select form-select-lg" th:classappend="${#fields.hasErrors('bloodGroup')} ? 'is-invalid' : ''">
                                            <option value="" disabled selected>-- Select Blood Group --</option>
                                            <option th:each="bg : ${bloodGroups}"
                                                    th:value="${bg}"
                                                    th:text="${#strings.replace(bg.name(), '_', ' ')}">A+</option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></div>
                                    </div>

                                    <!-- Units Required -->
                                    <div class="col-md-6">
                                        <label for="unitsRequired" class="form-label fw-semibold">Units Required (Whole Blood / RBC) <span class="text-danger">*</span></label>
                                        <input type="number" id="unitsRequired" th:field="*{unitsRequired}" class="form-control form-control-lg" min="1" max="100" th:classappend="${#fields.hasErrors('unitsRequired')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('unitsRequired')}" th:errors="*{unitsRequired}"></div>
                                    </div>

                                    <!-- Urgency -->
                                    <div class="col-md-6">
                                        <label for="urgency" class="form-label fw-semibold">Urgency Level <span class="text-danger">*</span></label>
                                        <select id="urgency" th:field="*{urgency}" class="form-select" th:classappend="${#fields.hasErrors('urgency')} ? 'is-invalid' : ''">
                                            <option th:each="urg : ${urgencies}"
                                                    th:value="${urg}"
                                                    th:text="${urg.name()}">NORMAL</option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('urgency')}" th:errors="*{urgency}"></div>
                                    </div>

                                    <!-- Required By Date -->
                                    <div class="col-md-6">
                                        <label for="requiredBy" class="form-label fw-semibold">Required By (Date & Time)</label>
                                        <input type="datetime-local" id="requiredBy" th:field="*{requiredBy}" class="form-control" th:classappend="${#fields.hasErrors('requiredBy')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('requiredBy')}" th:errors="*{requiredBy}"></div>
                                    </div>

                                    <!-- Province -->
                                    <div class="col-md-6">
                                        <label for="provinceId" class="form-label fw-semibold">Hospital Province <span class="text-danger">*</span></label>
                                        <select id="provinceId" th:field="*{provinceId}" class="form-select" th:classappend="${#fields.hasErrors('provinceId')} ? 'is-invalid' : ''">
                                            <option value="" disabled selected>-- Select Province --</option>
                                            <option th:each="prov : ${provinces}"
                                                    th:value="${prov.id}"
                                                    th:text="${prov.name}">Punjab</option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('provinceId')}" th:errors="*{provinceId}"></div>
                                    </div>

                                    <!-- City -->
                                    <div class="col-md-6">
                                        <label for="cityId" class="form-label fw-semibold">Hospital City <span class="text-danger">*</span></label>
                                        <select id="cityId" th:field="*{cityId}" class="form-select" th:classappend="${#fields.hasErrors('cityId')} ? 'is-invalid' : ''">
                                            <option value="" disabled selected>-- Select City --</option>
                                            <option th:each="c : ${cities}"
                                                    th:value="${c.id}"
                                                    th:text="${c.name}">Lahore</option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cityId')}" th:errors="*{cityId}"></div>
                                    </div>

                                    <!-- Hospital Notes -->
                                    <div class="col-12">
                                        <label for="hospitalNotes" class="form-label fw-semibold">Clinical Notes / Patient Context</label>
                                        <textarea id="hospitalNotes" th:field="*{hospitalNotes}" rows="3" class="form-control" placeholder="E.g. Trauma ICU patient, pre-surgery reserve, thalassemia requirement..."></textarea>
                                        <div class="form-text">Provide non-sensitive instructions or patient ward details.</div>
                                    </div>
                                </div>

                                <hr class="my-4">

                                <div class="d-flex justify-content-end gap-2 flex-wrap">
                                    <a th:href="@{/hospital/blood-requests}" class="btn btn-light border px-4 py-2 rounded-pill">Cancel</a>
                                    <button type="submit" class="btn btn-danger px-4 py-2 rounded-pill fw-semibold">
                                        <span>Create & Find Matches</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('provinceId').addEventListener('change', function() {
        const provinceId = this.value;
        const citySelect = document.getElementById('cityId');
        citySelect.innerHTML = '<option value="" disabled selected>Loading cities...</option>';

        if (!provinceId) return;

        fetch('/api/locations/provinces/' + provinceId + '/cities')
            .then(res => res.json())
            .then(cities => {
                citySelect.innerHTML = '<option value="" disabled selected>-- Select City --</option>';
                cities.forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city.id;
                    opt.textContent = city.name;
                    citySelect.appendChild(opt);
                });
            })
            .catch(err => {
                console.error('Failed to load cities:', err);
                citySelect.innerHTML = '<option value="" disabled selected>Error loading cities</option>';
            });
    });
</script>
</body>
</html>
