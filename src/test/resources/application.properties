# Test configuration — uses H2 in-memory database to allow tests
# to run without a live MySQL server.
spring.datasource.url=jdbc:h2:mem:donornexa_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable Spring Security auto-configuration interference during slice tests
spring.jpa.open-in-view=false

# In automated integration tests, disable forced first-login password change for the seeded admin
donornexa.admin.force-first-login-change=false

